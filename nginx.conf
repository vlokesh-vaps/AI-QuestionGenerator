user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    upstream backend_upstream {
        server backend:8050;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Maximum payload size for large textbook/curriculum DOCX & PDF uploads (50 MB)
        client_max_body_size 50M;

        # -------------------------------------------------------------------------
        # Scenario A: Reverse-Proxy under Custom Prefix (e.g. /question-paper/)
        # URL in browser: http://<DOMAIN>:<PORT>/question-paper/
        # -------------------------------------------------------------------------
        location /question-paper/ {
            # Strip prefix before forwarding to backend container
            proxy_pass http://backend_upstream/;

            # Forwarded Proxy Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /question-paper;
            proxy_set_header X-Forwarded-Port $server_port;

            # HTTP 1.1 with connection pooling & WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Extended timeouts for LLM generation & document chunking
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Redirect /question-paper (no trailing slash) to /question-paper/
        location = /question-paper {
            return 301 /question-paper/;
        }

        # -------------------------------------------------------------------------
        # Scenario B: Domain Root Deployment (/)
        # URL in browser: http://<DOMAIN>:<PORT>/
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://backend_upstream;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
