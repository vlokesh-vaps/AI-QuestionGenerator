version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_question_generator_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8050}:8050"
    environment:
      - HOST=0.0.0.0
      - PORT=8050
      - APPLICATION_ROOT=${APPLICATION_ROOT:-}
      - URL_PREFIX=${URL_PREFIX:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-70b-instruct}
      - WEB_CONCURRENCY=4
      - GUNICORN_TIMEOUT=300
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; port = os.getenv('PORT', '8050'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  reverse-proxy:
    image: nginx:alpine
    container_name: ai_question_generator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  storage_data:
