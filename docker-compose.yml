services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_question_generator
    restart: unless-stopped
    ports:
      - "${PORT:-8050}:8050"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8050
      - APPLICATION_ROOT=${APPLICATION_ROOT:-}
      - URL_PREFIX=${URL_PREFIX:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; port = os.getenv('PORT', '8050'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  storage_data:
